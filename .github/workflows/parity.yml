name: Parity

on: [push, pull_request]

jobs:
  linux-lavapipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (elan)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Software Vulkan + tools
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools gcc curl git
      - name: slangc
        run: |
          SLANG=2026.10.2
          mkdir -p "$HOME/slang"
          curl -fsSL "https://github.com/shader-slang/slang/releases/download/v${SLANG}/slang-${SLANG}-linux-x86_64-glibc-2.27.tar.gz" | tar -xz -C "$HOME/slang"
          echo "$HOME/slang/bin" >> "$GITHUB_PATH"
      - name: Build core, emit kernel + golden
        working-directory: core
        run: |
          lake build
          lake exe loot_demo
          lake exe loot_emit
      - name: Compile kernel to SPIR-V
        run: slangc core/build/kernel.slang -target spirv -profile glsl_450 -entry main -stage compute -o kernel.spv
      - name: Build + run parity runner
        run: |
          ( cd adapters/parity && ./build.sh )
          ./adapters/parity/parity_runner kernel.spv core/build/golden.csv

  macos-moltenvk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (elan)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # There is no vulkan-sdk cask; `brew install --cask vulkan-sdk` warned "No Cask
      # with this name exists" and fell through to the formulae every run. Install
      # them directly and let a real failure fail.
      #
      # volk dlopen()s "libvulkan.dylib" by bare name, and Homebrew puts it under
      # $(brew --prefix)/lib, which dyld does not search — volkInitialize returned
      # VK_ERROR_INITIALIZATION_FAILED. DYLD_LIBRARY_PATH does not fix it, because SIP
      # strips DYLD_* when it launches the protected /bin/bash each step runs in.
      # /usr/local/lib is in dyld's default fallback search and is not protected.
      - name: Vulkan loader + MoltenVK
        run: |
          brew install molten-vk vulkan-loader vulkan-tools
          sudo mkdir -p /usr/local/lib
          sudo ln -sf "$(brew --prefix)/lib/libvulkan.dylib" /usr/local/lib/libvulkan.dylib
          ls -l /usr/local/lib/libvulkan.dylib
      # Homebrew has no shader-slang formula, so `brew install shader-slang || true`
      # installed nothing and reported success. The failure surfaced two steps later
      # as `slangc: command not found`, exit 127. This takes the release tarball, the
      # same way the linux job does, and fails here if the download fails.
      - name: slangc
        run: |
          SLANG=2026.10.2
          case "$(uname -m)" in
            arm64|aarch64) ARCH=aarch64 ;;
            *)             ARCH=x86_64  ;;
          esac
          mkdir -p "$HOME/slang"
          curl -fsSL "https://github.com/shader-slang/slang/releases/download/v${SLANG}/slang-${SLANG}-macos-${ARCH}.tar.gz" | tar -xz -C "$HOME/slang"
          echo "$HOME/slang/bin" >> "$GITHUB_PATH"
          "$HOME/slang/bin/slangc" -v
      - name: Build core, emit kernel + golden
        working-directory: core
        run: |
          lake build
          lake exe loot_emit
      - name: Compile kernel to SPIR-V
        run: slangc core/build/kernel.slang -target spirv -profile glsl_450 -entry main -stage compute -o kernel.spv
      - name: Build + run parity runner (MoltenVK)
        run: |
          ( cd adapters/parity && ./build.sh )
          ./adapters/parity/parity_runner kernel.spv core/build/golden.csv
